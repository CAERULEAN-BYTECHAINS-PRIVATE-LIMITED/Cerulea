[package]
name = "pallet-cerulea-bridge"
version = "0.1.0"
description = "The Cerulea bridge module. Cross-network messaging with proof verification for every target network."
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support.workspace = true
frame-system.workspace = true
scale-info = { features = ["derive"], workspace = true }
sp-runtime.workspace = true
sp-core.workspace = true
sp-io.workspace = true
sp-crypto-hashing.workspace = true
sp-trie.workspace = true
cerulea-blueprint.workspace = true
pallet-cerulea-schema.workspace = true
pallet-cerulea-state.workspace = true
pallet-cerulea-audit.workspace = true
pallet-cerulea-governance.workspace = true
pallet-cerulea-logic.workspace = true

[dev-dependencies]
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }
sp-trie = { default-features = true, workspace = true }
pallet-cerulea-identity = { default-features = true, workspace = true }
pallet-cerulea-permission = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-runtime/std",
	"sp-core/std",
	"sp-io/std",
	"sp-crypto-hashing/std",
	"sp-trie/std",
	"cerulea-blueprint/std",
	"pallet-cerulea-schema/std",
	"pallet-cerulea-state/std",
	"pallet-cerulea-audit/std",
	"pallet-cerulea-governance/std",
	"pallet-cerulea-logic/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"pallet-cerulea-schema/runtime-benchmarks",
	"pallet-cerulea-state/runtime-benchmarks",
	"pallet-cerulea-audit/runtime-benchmarks",
	"pallet-cerulea-governance/runtime-benchmarks",
	"pallet-cerulea-logic/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
	"pallet-cerulea-schema/try-runtime",
	"pallet-cerulea-state/try-runtime",
	"pallet-cerulea-audit/try-runtime",
	"pallet-cerulea-governance/try-runtime",
	"pallet-cerulea-logic/try-runtime",
]
