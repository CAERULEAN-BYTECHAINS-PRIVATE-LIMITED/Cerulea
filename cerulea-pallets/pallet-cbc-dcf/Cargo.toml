[package]
name = "pallet-cerulea-dcf"
version = "0.1.0"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support.workspace = true
frame-system.workspace = true
scale-info = { features = ["derive"], workspace = true }
sp-std.workspace = true
sp-core.workspace = true
sp-runtime.workspace = true
sp-api.workspace = true
sp-io.workspace = true
pallet-timestamp = { workspace = true, default-features = false }
pallet-cerulea-pos = { path = "../pallet-cerulea-pos", default-features = false }
pallet-cerulea-poi = { path = "../pallet-cerulea-poi", default-features = false }
serde.workspace = true
log = { version = "0.4", default-features = false }

[dev-dependencies]
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }
pallet-balances = { default-features = true, workspace = true }
pallet-timestamp = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-std/std",
	"sp-core/std",
	"sp-runtime/std",
	"sp-api/std",
	"sp-io/std",
	"pallet-timestamp/std",
	"pallet-cerulea-pos/std",
	"pallet-cerulea-poi/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]
