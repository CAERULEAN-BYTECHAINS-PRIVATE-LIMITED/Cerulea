- id: baseline-tests
  title: Establish the chain test baseline and coverage reporting
  domain: testing
  model: sonnet
  priority: 3
  status: pending
  attempts: 0
  depends_on:
  - audit-chain
  owns:
  - cerulea-pallets/**/tests/
  - docs/TEST_BASELINE.md
  spec: 'Using docs/AUDIT_CHAIN.md, establish the current test baseline. Run the

    existing suite, record what passes and what fails, and add cargo llvm-cov

    coverage reporting to CI.


    Then write unit tests for the highest risk untested paths identified in the

    audit, starting with the DCF consensus vote aggregation and the finality

    justification builder. Do not modify production code in this task. If a

    test reveals a bug, document it in docs/TEST_BASELINE.md and let the fix be

    a separate task.


    Record the exact install command for any dependency added.

    '
  done_when:
  - cargo llvm-cov runs in CI and reports a coverage number
  - docs/TEST_BASELINE.md records current coverage and every failing test
  - new tests exist for vote aggregation and justification building
  - all added tests pass
- id: plan-chain
  title: Expand the chain domain into a task graph
  domain: chain
  model: opus
  priority: 5
  status: pending
  attempts: 0
  depends_on:
  - audit-chain
  - baseline-tests
  owns:
  - tasks.yaml
  spec: 'Read docs/AUDIT_CHAIN.md and docs/TEST_BASELINE.md. Append tasks to

    tasks.yaml that take the chain to the target state.


    Target: private chains are feature complete, permissioned, isolated, one

    per customer, deployable and stable. The public chain is basic and testnet

    only. Every remediation item from the audit is closed. DCF supports

    configurable consensus topology per chain, meaning open stake for public

    and fixed permissioned validator sets for private, with per tenant

    validator counts matching the billing add ons.


    Each appended task must have: id, title, domain chain, a model tier chosen

    by difficulty (haiku for mechanical, sonnet for normal, opus only for

    consensus reasoning), priority, status pending, attempts 0, depends_on,

    owns with explicit file paths, a spec precise enough that an agent with no

    other context can execute it, and done_when criteria that are objectively

    checkable by running a command.


    Prefer many small tasks over few large ones. No task should take an agent

    more than roughly forty turns. Do not write implementation code here.

    '
  done_when:
  - tasks.yaml contains the expanded chain tasks and remains valid YAML
  - every new task has objectively checkable done_when criteria
  - consensus reasoning tasks are assigned model opus, mechanical work haiku
- id: plan-studio
  title: Expand the Studio no code builder into a task graph
  domain: studio
  model: opus
  priority: 5
  status: pending
  attempts: 0
  depends_on:
  - audit-studio
  owns:
  - tasks.yaml
  spec: 'Read docs/AUDIT_STUDIO.md. Append tasks to tasks.yaml that build the no

    code builder to maximum achievable depth.


    This is the most important domain in the project. Studio is the only human

    interaction surface. A user must be able to define data models, business

    logic, roles and permissions, workflows, and a user interface, then deploy

    a private chain and a dapp, entirely without code. The in Studio code

    editor is a rare escape hatch, never the normal path.


    Design the primitive library first, then the templates built on it, then

    the compiler that turns builder output into a deployable chain

    configuration and contracts. Cover the common enterprise and government

    patterns: supply chain traceability, document registry and attestation,

    asset tokenisation, multi party approval workflow, audit trail, identity

    and role management.


    Same task format rules as plan-chain. Prefer many small tasks.

    '
  done_when:
  - tasks.yaml contains the expanded studio tasks and remains valid YAML
  - the primitive library, template set, and compiler each have their own tasks
  - every new task has objectively checkable done_when criteria
- id: plan-platform
  title: Expand backend, frontend, SDK, billing, intelligence into task graphs
  domain: backend
  model: opus
  priority: 6
  status: pending
  attempts: 0
  depends_on:
  - audit-studio
  - audit-chain
  owns:
  - tasks.yaml
  spec: 'Append tasks to tasks.yaml for the remaining domains.


    backend: API gateway, chain indexer, private chain provisioning

    orchestrator that spins up an isolated chain per customer within the

    promised window, usage metering feeding the billing entitlements.


    frontend: user Dashboard, Explorer, and the internal Operator Console

    showing revenue, signups, tier mix, chains deployed, node health. The

    Operator Console is distinct from the user Dashboard.


    sdk: client library and worked examples, documentation.


    billing: Stripe checkout, subscriptions, one time charges, webhooks that

    trigger provisioning, and entitlement gates enforcing the exact published

    pricing in CLAUDE.md including the auto upgrade rule.


    intelligence: Cerulea Intelligence as a product surface, bundled in every

    tier, wired to the Proof of Inference mechanism in the chain.


    Same task format rules as plan-chain.

    '
  done_when:
  - tasks.yaml contains tasks for all five domains and remains valid YAML
  - billing tasks reference the exact tier and add on prices from CLAUDE.md
  - every new task has objectively checkable done_when criteria
- id: coherence-sweep
  title: Daily coherence sweep across merged work
  domain: devops
  model: opus
  priority: 90
  status: pending
  attempts: 0
  depends_on:
  - plan-chain
  - plan-studio
  - plan-platform
  owns:
  - docs/COHERENCE.md
  spec: 'Read the diff of develop against its state twenty four hours ago. Check it

    against CLAUDE.md and the audit documents.


    Flag: convention drift across domains, duplicated logic, interfaces that no

    longer fit their consumers, any violation of the product rules, any place

    where an agent produced something that passes tests but does not actually

    work. Write findings to docs/COHERENCE.md and append corrective tasks to

    tasks.yaml for anything material.


    This task re queues itself daily by appending a fresh copy with an

    incremented id suffix.

    '
  done_when:
  - docs/COHERENCE.md updated with dated findings
  - corrective tasks appended for every material finding
  - a fresh coherence sweep task appended for the next day
