- id: ci-pipeline
  title: CI pipeline with the security gate on every pull request
  domain: devops
  model: sonnet
  priority: 2
  status: blocked
  attempts: 3
  depends_on: []
  owns:
  - .github/workflows/ci.yml
  - .github/workflows/security.yml
  spec: 'Create GitHub Actions workflows that run on every pull request to develop

    and to main.


    ci.yml: rust fmt check, clippy with warnings denied, cargo test, cargo

    build release, pnpm install, tsc noEmit, lint, test, build. All must pass.


    security.yml: run orchestrator/security-gate.sh, cargo audit, pnpm audit

    at high severity, and a secret scan. Any finding fails the job.


    Both workflows must be required checks. Nothing merges without them green.

    Do not add a workflow that can be skipped with a label or a commit message.

    '
  done_when:
  - both workflow files exist and are valid YAML
  - the workflows run every check listed above
  - no path exists to bypass the security workflow
