  timeout_seconds: 7200
  spec: "Read the chain codebase in full. It is roughly 60000 lines of Rust across\ncerulea-node, cerulea-runtime,\
    \ and four pallets (dcf, poi, pos, dvf), with\na custom consensus engine under cerulea-node/src/cerulea-consensus.\n\
    \nProduce docs/AUDIT_CHAIN.md covering:\n1. Module map. What each crate and pallet actually does.\n\
    2. The DCF consensus path end to end: block authoring, the PoS weighted 65\n   and Proof of Inference\
    \ weighted 35 selection, vote aggregation, and\n   justification building for finality.\n3. Every\
    \ issue listed in docs/CONSENSUS_BUGS.md, cross referenced against\n   the current code. State for\
    \ each whether it is still present, fixed, or\n   unclear, with file and line evidence.\n4. Safety\
    \ analysis of the finality gadget. Specifically: can a validator\n   equivocate, can the chain fork\
    \ under a network partition, what happens\n   if more than one third of validators are offline, and\
    \ is there any\n   unbounded loop or panic reachable from a network message.\n5. Test coverage gaps,\
    \ ranked by risk.\n6. A prioritized remediation list.\n\nDo not change code. This task produces one\
    \ document.\n"
