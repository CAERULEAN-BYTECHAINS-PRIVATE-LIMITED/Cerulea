[package]
name = "cerulea-platform-api"
version = "0.1.0"
description = "The platform runtime interfaces. The node and every reader reach the sixteen platform modules through the calls declared here."
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { workspace = true, features = ["derive", "alloc"], default-features = false }
sp-api.workspace = true
sp-runtime.workspace = true

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde/std",
	"sp-api/std",
	"sp-runtime/std",
]
