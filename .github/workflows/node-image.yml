name: node-image

# Builds the cerulea-node Docker image on GitHub's runners and publishes it to GHCR.
# Railway's builder kills this Rust build silently ~40 min in (see
# docs/LIVE_DEPLOYMENT_STATE.md), so Railway deploys the image published here instead of
# building from source. A failed build here never touches the running service.
on:
  push:
    branches: [pramaan-poc, develop]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - cerulea-node/**
      - cerulea-runtime/**
      - cerulea-pallets/**
      - pramaan-pallets/**
      - pramaan-primitives/**
      - tools/**
      - .github/workflows/node-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: node-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cerulea-node" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max

      - name: Summary
        run: echo "Published ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
