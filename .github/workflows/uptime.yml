name: uptime

# Every 15 minutes: the live site must report a connected, advancing chain. A failed run
# emails the workflow owner, which is how a dead backend gets noticed within minutes
# instead of weeks. Runs from the default branch (GitHub only schedules from there).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: cbc-pramaan.cerulea.io chain status
        run: |
          set -euo pipefail
          # The application exposes its chain status at /api/v1/chain/status; the older
          # path /api/chain/status is tried as a fallback so the check survives a cut-over.
          for attempt in 1 2 3; do
            for path in /api/v1/chain/status /api/chain/status; do
              body=$(curl -sS -m 25 "https://cbc-pramaan.cerulea.io$path" || true)
              echo "attempt $attempt $path: ${body:0:200}"
              if echo "$body" | grep -q '"connected":true'; then
                echo "connected via $path"
                exit 0
              fi
            done
            sleep 20
          done
          echo "::error::cbc-pramaan.cerulea.io cannot reach its chain: $body"
          exit 1
      - name: Railway node RPC direct
        run: |
          set -euo pipefail
          r=$(curl -sS -m 25 -X POST https://cbc-alice-production.up.railway.app -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"system_health","params":[]}')
          echo "$r"
          echo "$r" | grep -q '"result"' || { echo "::error::Railway node RPC not answering"; exit 1; }
