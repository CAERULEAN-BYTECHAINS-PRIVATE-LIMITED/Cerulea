# Build settings for the 32 GB build machine.
# Four jobs keep peak memory near 16 GB. sccache keeps rebuilds warm.
# The compiler flag works around a header defect in the storage library
# under modern compilers.
[build]
jobs = 4
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[env]
CXXFLAGS = "-include cstdint"

[profile.dev]
debug = 1
incremental = true
